<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地中梁施工図メーカー 試作版</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#eef2f6;color:#182434}header{background:#163456;color:white;padding:16px}main{max-width:1200px;margin:auto;padding:12px}.panel{background:white;padding:14px;border-radius:10px;margin:12px 0;box-shadow:0 1px 5px #ccd} .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}label{font-size:13px;display:block}input,select{box-sizing:border-box;width:100%;padding:9px;font-size:16px;border:1px solid #aaa;border-radius:5px}button{background:#1266a5;color:white;border:0;border-radius:6px;padding:11px 16px;font-size:16px;margin:5px 5px 5px 0}.sheet{overflow:auto;background:white}svg{width:100%;min-width:780px;height:auto} .warn{background:#fff2d9;padding:10px;border-left:4px solid #d80}small{color:#566} @media print{@page{size:A3 landscape;margin:9mm}body{background:white}header,.controls,.warn{display:none!important}main{max-width:none;padding:0}.panel{box-shadow:none;margin:0;padding:0}.sheet{overflow:visible}svg{min-width:0;width:100%;max-height:260mm}}</style></head><body><header><h2 style="margin:0">地中梁施工図メーカー（試作版）</h2><small style="color:#dce8f3">寸法入力 → 側面図・断面図を自動更新 → A3横PDF</small></header><main><section class="panel controls"><div class="fields"><label>スパン1 (mm)<input id="s1" type="number" value="6000" min="500"></label><label>スパン2 (mm)<input id="s2" type="number" value="6000" min="500"></label><label>スパン3 (mm)<input id="s3" type="number" value="6000" min="500"></label><label>柱幅 (mm)<input id="cw" type="number" value="800" min="100"></label><label>梁幅 (mm)<input id="bw" type="number" value="600" min="100"></label><label>梁せい (mm)<input id="bh" type="number" value="900" min="100"></label><label>上端筋 本数<input id="top" type="number" value="6" min="1"></label><label>上端筋 径<select id="td"><option>D25</option><option>D22</option><option>D29</option><option>D32</option><option>D19</option></select></label><label>下端筋 本数<input id="bottom" type="number" value="4" min="1"></label><label>下端筋 径<select id="bd"><option>D25</option><option>D22</option><option>D29</option><option>D32</option><option>D19</option></select></label><label>スターラップ 径<select id="sd"><option>D13</option><option>D10</option><option>D16</option></select></label><label>スターラップ 間隔(mm)<input id="pitch" type="number" value="150" min="50"></label><label>寸法基準<select id="basis"><option value="center">柱芯間</option><option value="face">柱内法</option></select></label><label>かぶり(mm) ※仮入力<input id="cover" type="number" value="60" min="0"></label></div><button onclick="window.print()">A3横PDFで保存・印刷</button><button onclick="saveData()">入力値を端末に保存</button><button onclick="restoreData()">保存値を読み込む</button><p><small>PDF保存：印刷画面で「PDFに保存」を選択。端末保存はこのブラウザ内のみです。</small></p></section><section class="panel"><div class="warn"><strong>施工確定用ではありません。</strong> 定着・継手位置・継手長さ・鉄筋段数・かぶり・配筋納まり・柱梁接合部・施工要領は構造図と仕様書で<strong>要確認</strong>。下図は概略模式図です。</div><div class="sheet"><svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" aria-label="地中梁側面図と断面図"></svg></div></section></main><script>
const ids=['s1','s2','s3','cw','bw','bh','top','td','bottom','bd','sd','pitch','basis','cover'];const el=id=>document.getElementById(id);const n=id=>Math.max(0,Number(el(id).value)||0);function t(x,y,txt,size=14,anchor='middle',color='#182434'){return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="sans-serif" font-size="${size}" fill="${color}">${txt}</text>`}function line(x1,y1,x2,y2,color='#303c4c',w=2,dash=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''}/>`}function rect(x,y,w,h,fill='none',stroke='#283748',sw=2){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`}function render(){const spans=[n('s1'),n('s2'),n('s3')],cw=n('cw'),bw=n('bw'),bh=n('bh'),total=spans.reduce((a,b)=>a+b,0);if(!total||!bw||!bh){el('drawing').innerHTML=t(560,200,'寸法を入力してください',24);return}const scale=790/(total+cw), x0=85, xs=[0,spans[0],spans[0]+spans[1],total].map(v=>x0+(v+cw/2)*scale), colW=Math.max(9,cw*scale), yTop=115,yBot=260,beamH=yBot-yTop;let s=rect(0,0,1120,680,'#fff','#fff',0)+t(560,40,'地中梁 配筋施工図（概略・要確認）',24);s+=t(475,80,'側面図（3スパン・4柱）',18);s+=rect(xs[0],yTop,xs[3]-xs[0],beamH,'#f8fbff','#1c4b72',2);xs.forEach((x,i)=>{s+=rect(x-colW/2,yTop-22,colW,beamH+44,'#dbe5ef','#516b82',2);s+=line(x,85,x,315,'#7b8796',1,'5 4');s+=t(x,330,'C'+(i+1),13)});const cov=Math.min(22,Math.max(8,n('cover')/bh*beamH));s+=line(xs[0],yTop+cov,xs[3],yTop+cov,'#b12b38',3)+line(xs[0],yBot-cov,xs[3],yBot-cov,'#176eab',3);const step=Math.max(12,Math.min(45,n('pitch')/total*790*4));for(let x=xs[0]+colW/2+step;x<xs[3]-colW/2;x+=step){s+=line(x,yTop+cov,x,yBot-cov,'#d78b28',1)}for(let i=0;i<3;i++){let mid=(xs[i]+xs[i+1])/2;s+=line(xs[i],350,xs[i+1],350,'#536b7b',1)+line(xs[i],343,xs[i],357)+line(xs[i+1],343,xs[i+1],357);s+=t(mid,371,`${spans[i].toLocaleString()} mm`,13)}s+=t(470,405,el('basis').value==='center'?'寸法表示：柱芯間':'入力寸法：柱内法（側面模式図は均等表示）',13);s+=t(475,435,`上端 ${n('top')}-${el('td').value}　下端 ${n('bottom')}-${el('bd').value}　ST ${el('sd').value}@${n('pitch')}`,16);s+=t(965,80,'断面図',18);const bx=910,by=145,drawW=140,drawH=210;s+=rect(bx,by,drawW,drawH,'#f8fbff','#1c4b72',3);const inset=Math.min(30,Math.max(12,n('cover')/bw*drawW));s+=rect(bx+inset,by+inset,drawW-2*inset,drawH-2*inset,'none','#d78b28',2);function bars(count,y,color){let usable=drawW-2*inset-12;for(let i=0;i<count;i++){let x=bx+inset+6+(count===1?usable/2:usable*i/(count-1));s+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${color}"/>`}}bars(Math.min(16,n('top')),by+inset+8,'#b12b38');bars(Math.min(16,n('bottom')),by+drawH-inset-8,'#176eab');s+=t(980,382,`B=${bw} mm`,15)+t(980,404,`D=${bh} mm`,15);s+=t(560,510,'赤：上端筋　青：下端筋　橙：スターラップ（模式表示）',15);s+=line(65,545,1050,545,'#b0b7c0',1);s+=t(70,577,'確認事項：定着・継手・鉄筋段数・配筋間隔・かぶり・柱梁接合部',15,'start');s+=t(70,606,'本図は入力内容の可視化用。構造図・配筋標準図と照合してから施工図を確定すること。',15,'start','#9b2834');s+=t(70,636,`表示スパン合計：${total.toLocaleString()} mm ／ 梁断面：${bw} × ${bh} mm`,14,'start');el('drawing').innerHTML=s}function saveData(){localStorage.setItem('beam-draft-v1',JSON.stringify(Object.fromEntries(ids.map(id=>[id,el(id).value]))));alert('この端末のブラウザに保存しました')}function restoreData(){try{let v=JSON.parse(localStorage.getItem('beam-draft-v1')||'{}');ids.forEach(id=>{if(v[id]!=null)el(id).value=v[id]});render()}catch(e){alert('保存データを読み込めません')}}ids.forEach(id=>el(id).addEventListener('input',render));render();
</script></body></html>
